    <script>
      try {
        var dark = localStorage.getItem('dq-theme') === 'dark';
        var signedIn = false;
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i) || '';
          if (key.indexOf('sb-') === 0 && key.slice(-11) === 'auth-token') signedIn = true;
        }
        if (dark && signedIn) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
